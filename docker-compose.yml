services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: easyim
      POSTGRES_PASSWORD: easyim
      POSTGRES_DB: easyim
    ports:
      # Host 5433 avoids clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - easyim_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyim -d easyim"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  easyim_pg:
