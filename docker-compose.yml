services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: easyim
      POSTGRES_PASSWORD: easyim
      POSTGRES_DB: easyim
    ports:
      # Host 5433 avoids clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - easyim_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyim -d easyim"]
      interval: 3s
      timeout: 5s
      retries: 10

  kafka:
    # Single-broker Kafka using KRaft (no ZooKeeper). Dev/testing only.
    # Host port 19092 avoids clashing with other local services on 9092.
    image: apache/kafka:3.7.0
    ports:
      - "19092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:19092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - easyim_kafka:/tmp/kraft-combined-logs
    healthcheck:
      # Pure TCP check against the in-container listener. kafka-topics.sh is
      # unusable here: it follows the advertised listener (host-mapped 19092),
      # which does not resolve inside the container.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  easyim_pg:
  easyim_kafka:
