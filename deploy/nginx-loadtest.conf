# easy-im load-test load balancer (dev, single machine).
# Distributes wrk traffic across N api node ports on the same host.
# Round-robin is fine: session cookies are stateless (JWT in DB-backed users).
#
# NOTE: loadtest.sh rewrites the upstream block to exactly NODES servers.

events {
    # WS load test needs many concurrent open connections (each upgrade holds
    # a long-lived socket). Default worker_connections=1024 is too low.
    worker_connections 8192;
}

http {
    # Non-root dev: log to stderr (captured by loadtest.sh) instead of
    # /var/log/nginx/* which requires root.
    error_log stderr;

    # Conditionally pass through WebSocket upgrade headers; plain HTTP requests
    # get a short-lived upstream connection so round-robin stays even.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    upstream easyim_api {
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
        server 127.0.0.1:8083;
    }

    server {
        listen 8080;
        server_name _;
        access_log off;

        location / {
            proxy_pass http://easyim_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Long-lived WS connections must not hit the 60s default timeout.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
